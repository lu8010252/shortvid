name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个版本号(例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 确定版本号
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 生成 Android 工程并打补丁
        working-directory: app
        run: |
          pip install pillow
          npm install --no-audit --no-fund
          npx cap add android
          python3 scripts/patch_android.py "${TAG#v}" "${{ github.run_number }}" ../public/icon-512.png
          npx cap sync android

      - name: 固定签名(保证后续版本能覆盖安装)
        run: |
          mkdir -p ~/.android
          cp app/signing/debug.keystore ~/.android/debug.keystore

      - name: 构建 APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 发布到 Releases
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk shortvid.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" shortvid.apk --clobber
          else
            gh release create "$TAG" shortvid.apk --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Android 安装包(通用 APK,适配所有 CPU 架构)。首次打开输入服务器地址即可。"
          fi
