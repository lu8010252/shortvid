name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个版本号(例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [phone, tv]
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 确定版本号
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 生成 Android 工程并打补丁
        working-directory: app
        run: |
          pip install pillow
          if [ "${{ matrix.variant }}" = "tv" ]; then cp capacitor.tv.config.json capacitor.config.json; fi
          npm install --no-audit --no-fund
          npx cap add android
          python3 scripts/patch_android.py "${TAG#v}" "${{ github.run_number }}" ../public/icon-512.png "${{ matrix.variant }}"
          npx cap sync android

      - name: 固定签名(保证后续版本能覆盖安装)
        run: |
          mkdir -p ~/.android
          cp app/signing/debug.keystore ~/.android/debug.keystore

      - name: 构建 APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 发布到 Releases
        run: |
          if [ "${{ matrix.variant }}" = "tv" ]; then APK=shortvid-tv.apk; else APK=shortvid.apk; fi
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "shortvid.apk = 手机版;shortvid-tv.apk = 电视/投影版(遥控器操作,适配 Android 8.0+)。首次打开输入服务器地址即可。" || true
          fi
          gh release upload "$TAG" "$APK" --clobber
